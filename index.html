<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>末日带娃100天</title>
<style>
/* ============ 冷灰绿+米黄暖调主题 ============ */
:root{
  --bg:#E8F0F8; --card:#FFFFFF; --ink:#2C3E50; --soft:#7F8C9A;
  --accent:#4A90D9; --accent2:#F5A623; --alert:#E74C3C; --warm:#F5A623; --health:#27AE60;
  --line:#D0DCE8; --ink-dark:#2C3E50; --shadow:0 4px 14px rgba(74,144,217,0.12);
  /* UI用系统圆体（各平台取最顺眼的中文字体），标题/叙事用楷体保留绘本质感 */
  --font-ui:system-ui,"PingFang SC","Noto Sans SC","Source Han Sans SC",sans-serif;
  --font-kai:"Kaiti SC","STKaiti","KaiTi","华文楷体","Songti SC",var(--font-ui);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:var(--font-ui);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;-webkit-touch-callout:none;touch-action:manipulation}
html{background:var(--bg)}
/* 标题、弹窗标题、叙事段落用楷体，其余UI用系统圆体 */
.topbar .title,#intro h1,#popup h3,#intro .story,#popup .story{font-family:var(--font-kai)}
body{background:var(--bg);color:var(--ink);min-height:100vh;max-width:480px;margin:0 auto;padding:calc(var(--safe-area-inset-top, env(safe-area-inset-top,0px)) + 10px) calc(var(--safe-area-inset-right, env(safe-area-inset-right,0px)) + 14px) calc(var(--safe-area-inset-bottom, env(safe-area-inset-bottom,0px)) + 14px) calc(var(--safe-area-inset-left, env(safe-area-inset-left,0px)) + 14px);line-height:1.5;position:relative}
/* 超窄屏（320~360px）收紧边距与字号，避免横向溢出 */
@media (max-width:360px){
  body{padding-left:8px;padding-right:8px}
  .topbar .title{font-size:16px;letter-spacing:2px}
  #intro h1{font-size:26px;letter-spacing:4px}
  .subbar .day{min-width:70px;font-size:12px}
  .actions{gap:6px}
  .actions button{font-size:13px;padding:12px 2px;min-height:58px}
  .actions .emoji{font-size:21px}
  .fort-card .fc-up{min-width:0;font-size:12px !important;padding:3px 6px !important}
  /* 超窄屏：孩子卡技能芯片收紧，保证4字技能名+Lv不溢出 */
  .kid{padding:8px 6px 7px}
  .kid .k-chip{font-size:9.5px}
  #popup{padding:13px}
}
/* 桌面/宽屏：在浏览器中央呈现一台“手机”，方便按真机比例查看实际游玩界面 */
@media (min-width:520px) and (min-height:600px){
  html{background:linear-gradient(160deg,#3A4A45 0%,#2A3530 100%)}
  body{max-width:390px;margin:22px auto;min-height:auto;border:10px solid #2A3530;border-radius:38px;box-shadow:0 24px 70px rgba(0,0,0,.45),0 0 0 2px #1A2320 inset}
  /* 仅主页（内容长）把手机框撑满视口；开场等短页面随内容收缩，避免框内大片留白 */
  body.home-active{min-height:calc(100vh - 44px)}
}
.view{display:none}.view.active{display:block}
button{font-family:inherit;color:var(--ink)}
button:disabled{opacity:.35;cursor:not-allowed}

/* ============ 顶栏：标题置中 + 副标题行（设置/日期/天气） ============ */
.topbar{margin-bottom:4px}
.topbar .title{text-align:center;font-size:19px;letter-spacing:4px;color:var(--ink-dark);font-weight:bold}
.subbar{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}
.subbar .right{display:flex;align-items:center;gap:6px}
.subbar .setting{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px 10px;display:flex;align-items:center;gap:3px;font-size:12px;cursor:pointer;box-shadow:var(--shadow)}
.subbar .setting small{font-size:10px;color:var(--soft)}
.subbar .weather{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px 9px;font-size:12px;white-space:nowrap}
.subbar .day{font-size:13px;text-align:right;min-width:78px;line-height:1.25}
.subbar .day small{display:block;font-size:10px;color:var(--soft)}

/* 防御度条右侧图标按钮：40px 触控盒方便手机点选；两个按钮收在 .def-igroup 小间距组里；
   emoji 字形视觉大小差异用字号单独补偿（🏫楼体矮胖，字号需更大） */
.def-ibtn{flex:0 0 40px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;padding:0;border-radius:9px;line-height:1}
.def-ibtn:active{background:rgba(44,62,80,.08)}
.def-igroup{flex:0 0 auto;display:flex;gap:2px}

/* ============ 教室场景 ============ */
.scene{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.scene .room{position:relative;border-radius:10px;overflow:hidden}
.scene .room>img{width:100%;display:block}
/* 加固点位徽章（叠在教室图上） */
.spot{position:absolute;background:rgba(253,254,255,.88);border:1px solid var(--line);border-radius:8px;padding:2px 5px;font-size:10px;color:var(--ink);text-align:center;line-height:1.3;box-shadow:0 2px 6px rgba(50,61,58,.15)}
.spot b{font-size:13px;display:block}
.spot .lv0{color:var(--alert)}.spot .lv1{color:var(--warm)}.spot .lv2{color:var(--accent)}.spot .lv3{color:var(--accent2)}
/* 左上角装饰架入口：纯图标圆形徽章（数量角标由JS渲染） */
#decor-shelf{position:absolute;left:8px;top:8px;z-index:6;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;background:rgba(253,254,255,.92);border:1px solid var(--line);border-radius:50%;box-shadow:0 2px 7px rgba(50,61,58,.2);cursor:pointer}
#decor-shelf:active{background:rgba(44,62,80,.1)}
#decor-shelf .ds-cnt{position:absolute;right:-4px;top:-4px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--accent2);color:#fff;font-size:9px;font-style:normal;font-weight:bold;line-height:15px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.25)}
/* 中央照片相框：深色木质描金边框 + 米色衬纸，冷色教室中的暖色回忆 */
.photo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;padding:7px;border-radius:7px;background:linear-gradient(145deg,#8a6540 0%,#64472a 48%,#7d5a37 100%);box-shadow:0 9px 20px rgba(35,45,40,.42),inset 0 0 0 1px rgba(219,187,120,.5),inset 0 1px 1px rgba(255,236,195,.4)}
/* 四角铜铆钉（替代顶中挂环：顶心独钉易有牌位联想，四钉四平八稳）
   左右用 left/right 双向锚定自适应框宽，铆钉中心落在7px木框的中线上 */
.photo::before,.photo::after{content:'';position:absolute;left:1px;right:1px;height:5px;pointer-events:none;
  background:
    radial-gradient(circle at 35% 30%,#f8e9b6 0%,#cba252 58%,#7d5d27 100%) left center/5px 5px no-repeat,
    radial-gradient(circle at 35% 30%,#f8e9b6 0%,#cba252 58%,#7d5d27 100%) right center/5px 5px no-repeat}
.photo::before{top:1px}
.photo::after{bottom:1px}
.photo .p-mat{background:linear-gradient(135deg,#fdf8ee,#f2e8d3);border-radius:3px;padding:6px 8px 5px;box-shadow:inset 0 0 0 1px rgba(120,90,50,.3);text-align:center}
.photo .p-row{display:flex;gap:6px;align-items:flex-end;justify-content:center}
.photo .p-row img{display:block}
.photo .p-teacher{height:104px}
.photo .p-kids{height:96px}
/* 立绘孩子头顶：觉醒后悬浮一颗紫色爱心，发光+轻飘 */
.photo .kp{position:relative;display:inline-block;line-height:0;perspective:120px;animation:kpBob 3.8s ease-in-out infinite;will-change:transform}
@keyframes kpBob{0%,100%{transform:translateY(5.5px)}50%{transform:translateY(3px)}}
.photo .kp .p-kids{animation:none}
.photo .kp .kp-nk{position:absolute;left:50%;top:-15px;transform:translate(-50%,0) scale(1);width:22px;height:22px;pointer-events:none;opacity:0;transition:opacity .35s;z-index:6}
.photo .kp .kp-nk.wears{opacity:1;animation:kpBreath 2.4s ease-in-out infinite}
@keyframes kpBreath{0%,100%{transform:translate(-50%,0) scale(1)}50%{transform:translate(-50%,0) scale(1.2)}}
/* 超窄屏：照片相框与装饰架徽章同步收紧，避免左上角重叠（须置于基础规则之后） */
@media (max-width:360px){
  .photo .p-teacher{height:92px}
  .photo .p-kids{height:85px}
  #decor-shelf{width:30px;height:30px;left:6px;top:6px;font-size:17px}
}

/* ============ 老师状态条 ============ */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;grid-gap:6px;gap:6px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.stat .name{color:var(--soft);font-size:11px}
.stat .stat-row{display:flex;justify-content:space-between;align-items:baseline}
.stat .bar{height:5px;background:#DDE4E1;border-radius:3px;margin-top:4px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
/* 老师状态条语义色与顺序（左→右）：健康绿 / 饱腹橙 / 体力蓝（与孩子卡三色一一对应） */
.stat.fed .bar i{background:var(--warm)}
.stat.hp .bar i{background:var(--health)}
.stat.sta .bar i{background:var(--accent)}
/* 任一状态低于30：红条警告（优先级同上，置于语义色之后保证覆盖） */
.stat.low .bar i{background:var(--alert)}
.stat .val{font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums}

/* ============ 孩子卡片 ============ */
.kids{display:grid;grid-template-columns:1fr 1fr 1fr;grid-gap:6px;gap:6px;margin-bottom:10px}
.kid{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 8px 7px;text-align:center}
.kid.down{opacity:.55;border-style:dashed}
/* 名字行：名字居中加粗，信任度收成右上角小字，不再挤在名字后面 */
.kid .k-name{font-size:13px;font-weight:bold;position:relative;line-height:1.35}
.kid .k-trust{position:absolute;right:0;top:2px;font-size:8.5px;font-weight:normal;color:#B0A18C}
.kid .k-trust.zero{color:var(--alert)}
.kid .k-trait{font-size:9px;color:var(--soft);margin-top:1px;line-height:1.3}
/* 技能位（固定预留）：未觉醒=虚线空槽；觉醒后=紫色芯片，技能名与Lv同时出现 */
.kid .k-slot{margin-top:5px;min-height:18px;border:1px dashed #C3CCD6;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:2px 3px;font-size:8.5px;color:#A8B3BD;line-height:1.2}
.kid .k-skills{margin-top:5px;display:flex;flex-direction:column;gap:3px}
.kid .k-skills .k-chip{border:1px solid #CE93D8;background:#fff;color:#6A1B9A;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:4px;padding:3px 6px;font-size:9.5px;font-weight:600;line-height:1.3}
.kid .k-skills.off{opacity:.5}
.kid .k-bars{margin-top:5px;display:flex;flex-direction:column;gap:3px}
.kid .k-bar{display:flex;align-items:center;gap:3px;font-size:8px;color:var(--soft)}
.kid .k-bar span{width:22px;text-align:right}
.kid .k-bar .kb{flex:1;height:4px;background:#DDE4E1;border-radius:2px;overflow:hidden}
.kid .k-bar .kb i{display:block;height:100%;border-radius:2px}
/* 孩子三状态语义色与顺序（上→下）：健康绿 / 饱腹橙 / 情绪蓝 */
.kid .kb.f i{background:var(--warm)}.kid .kb.m i{background:#F06292}.kid .kb.h i{background:var(--health)}
/* 任一状态低于30：红条警告（写在语义色之后保证覆盖） */
.kid .kb.low i{background:var(--alert)}
.kid .k-state{font-size:9px;color:var(--alert);margin-top:3px;min-height:12px;line-height:1.25}

/* ============ 物资栏 ============ */
.inv{margin-bottom:10px}
.inv .cell{flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:12px;white-space:nowrap}
.inv .cell small{display:block;font-size:9px;color:var(--soft)}
.inv .cell.cell-extra{flex:0 0 100%;text-align:left;padding:5px 10px;line-height:1.7;word-break:break-all}

/* ============ 行动按钮（大按钮方便手机点选） ============ */
.actions{display:flex;gap:6px}
.actions button{flex:1;min-width:0;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 2px;min-height:60px;font-size:12px;cursor:pointer;box-shadow:var(--shadow)}
.actions button:active{transform:translateY(1px);filter:brightness(1.1)}
.actions .emoji{display:block;font-size:24px;margin-bottom:3px}
.actions button.night-btn{border-color:var(--accent);background:#DDE4E1}
/* 外出按钮：剩余次数浓缩为右上角倒数角标，按钮本身与其它按钮同尺寸 */
.actions button.out-btn{position:relative}
.actions button .out-cnt{position:absolute;right:4px;top:3px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:#64472A;color:#fff;font-size:9.5px;font-style:normal;font-weight:bold;line-height:15px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.2)}
/* 第3节起天色渐晚：角标转红提示高风险（替代原小字横幅）；次数用尽显示灰色0 */
.actions button.out-late .out-cnt{background:var(--alert)}
.actions button.out-zero .out-cnt{background:var(--soft);box-shadow:none}
/* 超窄屏角标收紧（此媒体块须置于基础规则之后，否则会被上方基础规则层叠覆盖） */
@media (max-width:360px){
  .actions button .out-cnt{right:3px;top:2px;min-width:14px;height:14px;font-size:9px;line-height:14px}
}

/* ============ 通用弹窗 ============ */
#mask{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(50,61,58,.45);display:none;z-index:20;align-items:center;justify-content:center;padding:20px}
#mask.show{display:flex}
#popup{background:var(--card);border-radius:16px;max-width:420px;width:100%;max-height:82vh;max-height:82dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#popup h3{text-align:center;font-size:17px;letter-spacing:2px;margin-bottom:10px;color:#F2A25C;}
#popup .story{font-size:14px;color:var(--ink);background:var(--bg);border-radius:10px;padding:10px 12px;line-height:1.8;margin-bottom:10px;white-space:pre-line}
#popup .btns{display:flex;gap:8px;flex-wrap:wrap}
#popup .btns button{flex:1;min-height:46px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-color:var(--line);color:var(--ink);border-radius:12px;font-size:14px;padding:8px;cursor:pointer}
#popup .btns button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#popup .btns button:hover{filter:brightness(1.1)}
#popup .btns button.danger{background:var(--alert);color:#fff;border-color:var(--alert)}
#popup .btns button:active{transform:translateY(1px)}
#popup .hint{font-size:11px;color:var(--soft);text-align:center;margin-top:8px}

/* 天台菜园：白色泡沫箱地块（3×2 网格，箱口露出泥土） */
.gd-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:8px;gap:8px}
/* 方块基线：padding-top 撑出正方形（旧版内核不支持 aspect-ratio），新内核用 aspect-ratio */
.gd-tile{position:relative;border-radius:12px;padding:0;user-select:none;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(160deg,#FCFDFB 0%,#EFF3EC 55%,#DFE6DB 100%);
  border:2px solid #C3CCBE;
  box-shadow:0 2px 5px rgba(60,70,55,.13),inset 0 1px 0 #fff,inset 0 -3px 8px rgba(90,105,80,.10)}
/* 基线：伪元素 padding-top:100% 撑出正方形（内部元素均为绝对定位）*/
.gd-tile::before{content:"";display:block;padding-top:100%}
@supports (aspect-ratio:1/1){
  .gd-tile{aspect-ratio:1/1}
  .gd-tile::before{display:none}
}
.gd-tile .gd-no{position:absolute;top:2px;left:6px;font-size:8.5px;opacity:.7;font-weight:bold;z-index:3;color:#5C6657;text-shadow:0 1px 1px rgba(255,255,255,.9)}
/* 箱口的泥土（内凹湿土+犁沟） */
.gd-tile .gd-soil{position:absolute;left:7px;right:7px;top:12px;bottom:14px;border-radius:7px;
  border:1px solid #5C3E20;
  background:
    repeating-linear-gradient(180deg,transparent 0 7px,rgba(0,0,0,.13) 7px 9px),
    linear-gradient(160deg,#8F6637,#6B4A27);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.40),0 1px 0 rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.gd-tile .gd-crop{font-size:26px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.gd-tile .gd-plus{font-size:20px;color:#F3E7D0;opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.4)}
/* 空箱：点击播种 */
.gd-tile.empty{cursor:pointer}
.gd-tile.empty:active{filter:brightness(.97)}
/* 生长中：箱体下缘贴极简天数小标；未浇水的可点（浇水催熟），浇过的右上💧角标 */
.gd-tile[data-water]{cursor:pointer}
.gd-tile[data-water]:active{transform:scale(.97)}
.gd-tile .gd-watered{position:absolute;top:1px;right:4px;font-size:9.5px;z-index:3;filter:drop-shadow(0 1px 1px rgba(255,255,255,.7))}
.gd-tile .gd-days{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);z-index:3;
  font-size:8.5px;line-height:1.4;background:#5C6657;color:#fff;border-radius:5px;padding:0 6px;font-variant-numeric:tabular-nums}
/* 成熟：箱口金边呼吸光 + 作物跳动 */
.gd-tile.mature{cursor:pointer}
.gd-tile.mature:active{transform:scale(.97)}
.gd-tile.mature .gd-soil{border-color:#4F8A33;animation:gdGlow 1.6s ease-in-out infinite}
.gd-tile.mature .gd-crop{animation:gdBounce 1.1s ease-in-out infinite}
/* 未开垦：灰色空泡沫箱（虚线=还没弄来） */
.gd-tile.locked{background:linear-gradient(160deg,#F0F1EE,#D7DCD4);border:2px dashed #A6AEA0;box-shadow:none;cursor:pointer}
.gd-tile.locked.cant{cursor:not-allowed}
.gd-tile.locked .gd-lockico{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;font-size:18px;opacity:.85}
.gd-tile.locked .gd-lockcost{position:absolute;bottom:3px;left:3px;right:3px;font-size:10px;line-height:1.25;text-align:center;color:#5C6657;font-weight:600}
.gd-tile.locked .gd-lockcost span{display:inline-block;padding:0;margin:0 2px;white-space:nowrap}
.gd-tile.locked .gd-lockcost small{font-size:9px}
@keyframes gdBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes gdGlow{0%,100%{box-shadow:inset 0 2px 6px rgba(0,0,0,.35),0 0 0 2px rgba(124,180,94,.35)}50%{box-shadow:inset 0 2px 6px rgba(0,0,0,.35),0 0 0 3px rgba(124,180,94,.65)}}

/* ============ 照顾页：老师卡 + 孩子卡（竖排：信息→数值条→按钮底排） ============ */
.ck-card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.ck-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:5px}
.ck-head b{font-size:14px}
.ck-head .ck-meta{font-size:10px;color:var(--soft);white-space:nowrap}
/* 数值条：标签 + 轨道 + 右侧数字（老师/孩子通用，三色：健康红/饱腹橙/情绪体力蓝） */
.ck-stat{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--soft);margin-top:4px}
.ck-stat .lbl{width:24px;text-align:right;flex:none}
.ck-stat .track{flex:1;min-width:0;height:5px;background:#DDE4E1;border-radius:3px;overflow:hidden}
.ck-stat .track i{display:block;height:100%;border-radius:3px}
.ck-stat .num{width:32px;flex:none;text-align:right;font-size:10px;color:var(--ink);font-variant-numeric:tabular-nums}
/* 照顧頁：信任成長條（信任灌滿直接升級，Lv 徽章在條尾端） */
.ck-trust{display:flex;align-items:center;gap:6px;margin:5px 0 2px}
.ck-trust .ckt-track{position:relative;flex:1;min-width:0;height:11px;background:#E4E9EC;border-radius:6px}
.ck-trust .ckt-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#BBDFFB 0%,#4A90D9 60%,#2E6FBF 100%)}
.ck-trust .ckt-fill::after{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 55%)}
.ck-trust .ckt-heart{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:12px;line-height:1;z-index:3;pointer-events:none}
.ck-trust .ckt-txt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:9.5px;color:#1F2D3D;white-space:nowrap;pointer-events:none;text-shadow:0 0 3px #fff,0 0 2px #fff}
.ck-trust .ckt-lv{flex:none;height:18px;min-width:34px;padding:0 7px;border-radius:999px;background:#4A90D9;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ck-skills{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.ck-skills span{font-size:10px;background:#fff;color:#6A1B9A;border:1px solid #CE93D8;padding:1px 6px;border-radius:6px}
/* 底排操作按钮：一行排开与老师卡一致 */
.ck-actions{display:flex;gap:5px;align-items:center;margin-top:9px}
.ck-actions button{flex:1;min-width:0;min-height:32px;padding:3px 4px;font-size:11.5px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
.ck-actions button:disabled{opacity:.35;cursor:not-allowed}
.ck-actions .ck-feed{border-color:var(--accent);color:var(--accent)}
.ck-actions .ck-heal{border-color:#C89E3A;color:#9C6B1F;background:#FFFBEF}
.ck-actions .ck-pendant{flex:0 0 auto;padding:3px 8px;border-color:#BA68C8;color:#7B1FA2;background:#F3E5F5}
/* 照顾页第二行：佩戴项链按钮与安抚各占一半，加大更易点击 */
.ck-userow .ck-pendant{flex:1;min-height:32px;padding:3px 8px;font-size:12px;border-radius:8px;border:1.5px solid #BA68C8;background:#F3E5F5;color:#7B1FA2;cursor:pointer;white-space:nowrap}
.ck-userow .ck-pendant:disabled{opacity:.35;cursor:not-allowed}
/* 照顾页孩子卡按钮：3列网格两行，喂食/佩戴在中列、补品/安抚在右列 */
.ck-kid-actions{display:grid;grid-template-columns:38px 1fr 1fr;column-gap:6px;row-gap:8px;margin-top:8px;align-items:center}
.ck-kid-actions .use-btn{min-height:32px;padding:3px 14px;font-size:12px;border-radius:8px;border:1.5px solid #F5A623;background:#F5A623;color:#fff;cursor:pointer;white-space:nowrap}
.ck-kid-actions .use-btn:disabled{opacity:.35;cursor:not-allowed}
.ck-kid-actions .ck-pendant{min-height:32px;padding:3px 8px;font-size:12px;border-radius:8px;border:1.5px solid #BA68C8;background:#F3E5F5;color:#7B1FA2;cursor:pointer;white-space:nowrap}
.ck-kid-actions .ck-pendant:disabled{opacity:.35;cursor:not-allowed}
/* 照顾页技能说明行（点技能胶囊展开） */
.ck-skilltip{font-size:11px;color:#6A1B9A;background:#F3E5F5;border:1px solid #CE93D8;border-radius:6px;padding:3px 8px;margin-top:4px;line-height:1.5;cursor:pointer}
/* 老师卡：虚线选择框（选中后显物品图标）+ 食用按钮 */
/* 老师卡：两行并排（吃饭 / 服用），每行一个虚线 pick-box + 执行按钮 */
.ck-teacher-rows{display:flex;gap:10px;margin-top:8px}
.ck-userow{display:flex;align-items:center;gap:6px;flex:1}
.pick-box{width:38px;height:32px;border:1.5px dashed #F5A623;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;background:#fff;flex:none;position:relative;line-height:1;cursor:pointer;user-select:none}
.pick-box:active{background:#F5F7FA}
.pick-box.has{border-style:solid;border-color:#F5A623;background:#FFF4E6;position:relative}
.pick-box.has.med{border-color:#81C784;background:#F1F8EE}
/* 选项链框：紫色系（未选白底紫框，选中变紫底） */
.pick-box.ppick{border-color:#BA68C8;color:#7B1FA2;background:#fff}
.pick-box.ppick.has{border-style:solid;background:#EDE7F6}
/* 服用(药品)框：绿色系（未选白底绿框，选中变绿底） */
.pick-box.med{border-color:#66BB6A;color:#2E7D32;background:#fff}
.pick-box.med.has{border-style:solid;border-color:#81C784;background:#F1F8EE}
/* 选中态：右上角 ✕ 提示可点取消 */
.pick-box.has::after{content:'✕';position:absolute;right:-5px;top:-5px;width:14px;height:14px;background:var(--alert);color:#fff;border-radius:50%;font-size:8px;display:flex;align-items:center;justify-content:center;line-height:1}
.pick-box .pb-cnt{position:absolute;right:1px;bottom:-1px;font-size:8px;color:var(--soft);line-height:1}
.ck-userow button.use-btn{min-height:32px;padding:3px 14px;font-size:12px;border-radius:8px;border:1.5px solid #F5A623;background:#F5A623;color:#fff;cursor:pointer;flex:1}
.ck-userow button.use-btn:disabled{opacity:.35;cursor:not-allowed}
.ck-userow button.use-btn.med{border-color:#81C784;background:#81C784}
/* 物品浮层：遮罩 + 居中面板（绝对定位覆盖 #popup 内部） */
#popup{position:relative}
.ck-overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center}
.ck-overlay-panel{background:#fff;border-radius:14px;padding:12px;max-width:92%;width:320px;max-height:75%;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.2);-webkit-overflow-scrolling:touch}
.ck-overlay-panel h4{margin:0 0 8px;font-size:13px;color:var(--ink);text-align:center;font-weight:600}
.ck-overlay-panel .ck-close{display:block;margin:8px auto 0;background:transparent;border:none;color:var(--soft);font-size:12px;cursor:pointer}
/* 浮层内物品按钮网格 */
.ck-overlay-panel .op-grid{display:flex;gap:6px;flex-wrap:wrap}
.ck-overlay-panel .op-grid button{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;font-size:11px;padding:6px 8px;cursor:pointer;line-height:1.3;flex:1;min-width:90px;min-height:44px}
.ck-overlay-panel .op-grid button:hover{border-color:var(--accent);background:#EAF2FB}
.ck-overlay-panel .op-grid button.med:hover{border-color:#81C784;background:#F1F8EE}
.ck-overlay-panel .op-grid button small{font-size:9px;color:var(--soft)}
.ck-overlay-panel .op-empty{text-align:center;color:var(--soft);font-size:12px;padding:16px 0}

/* 加固点位卡片：紧凑两列版（图标+名称Lv同行 / 白底徽章 / 绿刻度 / 全宽升级钮 / 齐底布防行） */
.fort-grid{display:grid;grid-template-columns:1fr 1fr;grid-gap:8px;gap:8px}
.fort-card{position:relative;background:linear-gradient(180deg,#FDFDFC,var(--card));border:1.5px solid var(--line);border-radius:12px;padding:8px 9px;box-shadow:0 1px 4px rgba(50,61,58,.06);display:flex;flex-direction:column;overflow:hidden;line-height:1.4}
.fort-card.fc-broken{border-color:#E3A39A;background:linear-gradient(180deg,#FFF8F6,#FDEDEA)}
.fort-card.fc-max{border-color:#D9C58A;background:linear-gradient(180deg,#FDFAF0,#FAF2DC)}
/* 头部：图标块 + 名称/Lv + 盾牌徽章 */
.fort-card .fc-head{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.fort-card .fc-ico{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;border-radius:8px;background:linear-gradient(135deg,#F5EBD8,#EADFC8);border:1px solid #D9C3A0}
.fort-card.fc-broken .fc-ico{background:linear-gradient(135deg,#F9E3DF,#F3CFC7);border-color:#E5ADA4}
.fort-card.fc-max .fc-ico{background:linear-gradient(135deg,#F7EDD0,#EEDCA4);border-color:#D9C58A}
.fort-card .fc-id{flex:1;min-width:0;display:flex;align-items:baseline;gap:2px;flex-wrap:nowrap}
.fort-card .fc-name{font-size:13.5px;font-weight:bold;line-height:1.1;color:var(--ink);white-space:nowrap}
.fort-card .fc-lvtext{font-size:10px;color:#6E6A60;white-space:nowrap}
/* 盾牌防御徽章：白底，颜色加在整枚徽章（盾牌+数字同色），数字自然宽度 */
.fort-card .fc-defbadge{flex:none;font-size:12px;line-height:1;padding:2px 7px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:bold;display:inline-flex;align-items:center;gap:1px;white-space:nowrap}
.fort-card .fc-defbadge b{font-size:12px;line-height:1}
/* 5 格刻度：绿色 */
.fort-card .fc-pips{display:flex;gap:3px;margin:3px 0 5px}
.fort-card .fc-pips i{flex:1;height:4px;border-radius:2px;background:#E2E6EA}
.fort-card .fc-pips i.on{background:linear-gradient(180deg,#66BB6A,#2E7D32)}
/* 威胁提示 / 破损警告 */
.fort-card .fc-threat{font-size:9px;color:#8a7a60;margin:1px 0 3px;line-height:1.3}
.fort-card .fc-warn{font-size:10px;color:var(--alert);font-weight:bold;margin:2px 0}
/* 底部：升级按钮全宽 + 材料行（置中） */
.fort-card .fc-foot{display:flex;flex-direction:column;gap:5px;margin-top:5px}
.fort-card .fc-up{width:100%;min-height:30px;padding:3px 9px;font-size:12px;font-weight:bold;color:#fff;border:none;border-radius:9px;cursor:pointer;background:linear-gradient(180deg,#5BA0E6,#4A90D9);white-space:nowrap}
.fort-card .fc-up:active{transform:translateY(1px)}
.fort-card .fc-up:disabled{background:var(--bg);color:var(--soft);font-weight:normal;border:1px solid var(--line);cursor:not-allowed}
.fort-card.fc-broken .fc-up{background:linear-gradient(180deg,#EE7E73,var(--alert))}
.fort-card.fc-max .fc-up:disabled{background:linear-gradient(180deg,#F0E4C0,#E3D097);color:#8A7434;border:1px solid #D9C58A;font-weight:bold}
.fort-card .fc-cost{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:7px}
.fort-card .fc-cost>span{flex:0 0 auto;font-size:9px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 4px;white-space:nowrap;text-align:center}
.fort-card .fc-cost small{font-size:9px;color:var(--soft)}
/* 布防行：齐底（margin-top:auto），已布防图标无框无背景，按数量重复 */
.fort-card .fc-equip{display:flex;align-items:center;gap:5px;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
.fort-card .fc-placed{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.fort-card .fc-gear{flex:none;min-width:66px;min-height:30px;font-size:12px;font-weight:bold;border:1.5px solid var(--accent);color:var(--accent);background:#EAF2FB;border-radius:8px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.fort-card .fc-gear:active{background:#DCE9F7}
.fort-card .placed-icon{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:28px;font-size:16px;padding:0 2px;border:none;background:transparent;cursor:pointer;line-height:1}
.fort-card .no-placed{font-size:10px;color:var(--soft);font-style:italic}

/* 加固页：设备制作行（保持原有行式布局） */
.fort-row{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:10px;margin-bottom:6px;font-size:13px}
.fort-row .f-info{flex:1;min-width:0}
.fort-row .f-info b{font-size:15px}
.fort-row .f-info small{display:inline;color:var(--soft);font-size:12px;margin-right:4px}
.fort-row .f-info .dev-stock{color:var(--warm);font-size:13px;margin-left:8px;font-weight:600}
.fort-row .f-info .dev-desc{display:block;font-size:10px;margin:2px 0}
.fort-row .f-info .cost-line{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;letter-spacing:0;margin:6px 0 0;padding:0}
.fort-row .f-info .cost-line>span{display:inline-flex;align-items:center;margin:0;padding:0;font-size:13px;line-height:1.6}
.fort-row .f-info .cost-line small{margin:0 0 0 2px;padding:0;font-size:12px}
.fort-row button{min-width:88px;min-height:40px;border:1.5px solid var(--accent);background:var(--card);color:var(--ink);border-radius:10px;font-size:12px;padding:4px;cursor:pointer}
.fort-row button:disabled{border-color:var(--line);color:var(--soft);opacity:.5}
.fort-row .pend-btns{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.fort-row .pend-btns button{min-width:84px;min-height:38px}
/* 晶核项链卡片：标题行 → 框线材料行 → 制作/分解平分一行 */
.pend-card{background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pend-head{display:flex;align-items:baseline;gap:6px;margin-bottom:7px}
.pend-ico{font-size:18px;line-height:1}
.pend-head b{font-size:15px;color:var(--ink)}
.pend-stock{font-size:12px;color:var(--warm);font-weight:600;white-space:nowrap}
.pend-cost{display:flex;flex-wrap:nowrap;gap:3px;margin-bottom:8px}
.pend-cost>span{flex:1;display:flex;align-items:center;justify-content:center;gap:1px;background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 2px;font-size:12px;white-space:nowrap;text-align:center}
.pend-cost>span small{font-size:11px}
.pend-btns{display:flex;gap:8px;margin-bottom:8px}
.pend-btns button{flex:1;min-height:40px;border:1.5px solid #BA68C8;background:var(--card);color:#7B1FA2;border-radius:10px;font-size:13px;padding:4px;cursor:pointer}
.pend-btns button:disabled{border-color:var(--line);color:var(--soft);opacity:.5}
/* 已放置设备的可移除标签（保留兼容） */
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#DDE4E1;border:1px solid var(--accent);color:var(--accent);cursor:pointer}
/* 加固点位等级颜色 */
.lv-ok{background:#DDE8DE;color:#4B635E}
.lv-mid{background:#F0E8DA;color:#8A7A5A}
.lv-low{background:#F5EBD8;color:#B8956A}
.lv-broken{background:#F8D7DA;color:#C0392B;font-weight:bold}

/* ============ 开场页：教室图暗化主视觉 + 逐句浮现 ============ */
#intro{text-align:center;padding:0}
#intro .hero{position:relative;border-radius:18px;overflow:hidden;padding:48px 18px 30px;margin-bottom:16px;
  background:linear-gradient(180deg,rgba(13,20,32,.30) 0%,rgba(13,20,32,.62) 55%,rgba(13,20,32,.82) 100%),var(--roomImg,linear-gradient(160deg,#3A4A45,#24302B)) center 32%/cover no-repeat;
  box-shadow:0 10px 26px rgba(30,45,60,.28)}
#intro .hero::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
  background:radial-gradient(80% 60% at 50% 40%,rgba(245,166,35,.10),transparent 70%)}
#intro h1{position:relative;font-size:32px;letter-spacing:8px;color:#FDF3E2;text-shadow:0 2px 14px rgba(0,0,0,.55);margin-bottom:10px;animation:heroIn 1.1s cubic-bezier(.2,.8,.25,1) both}
#intro .sub{position:relative;color:#DCE6F2;font-size:13px;letter-spacing:1px;animation:heroIn 1.1s .25s cubic-bezier(.2,.8,.25,1) both}
@keyframes heroIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#intro .story{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:14px 16px;color:var(--soft);font-size:14px;margin-bottom:18px;line-height:2;text-align:left}
#intro .story .ln{display:block;opacity:0;animation:lineIn .65s ease forwards}
#intro .story .ln:nth-child(1){animation-delay:.45s}
#intro .story .ln:nth-child(2){animation-delay:.75s}
#intro .story .ln:nth-child(3){animation-delay:1.05s}
#intro .story .ln:nth-child(4){animation-delay:1.35s}
#intro .story .ln:nth-child(5){animation-delay:1.65s}
@keyframes lineIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.gender-pick{display:flex;gap:12px;margin-bottom:16px}
.gender-pick button{flex:1;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 6px;font-size:16px;cursor:pointer;transition:all .2s}
.gender-pick button img{height:110px;display:block;margin:0 auto 6px}
.gender-pick button.active{border-color:var(--accent);background:#EAF2FB;box-shadow:0 4px 14px rgba(74,144,217,.22)}
#intro .start{width:100%;min-height:56px;background:linear-gradient(135deg,#4A90D9,#3A7BC8);color:#fff;border:none;border-radius:14px;font-size:17px;letter-spacing:4px;cursor:pointer;box-shadow:0 6px 16px rgba(74,144,217,.32);animation:startPulse 2.4s ease-in-out infinite}
@keyframes startPulse{0%,100%{box-shadow:0 6px 16px rgba(74,144,217,.32)}50%{box-shadow:0 6px 22px rgba(74,144,217,.55)}}
#intro .start:disabled{opacity:.4;animation:none;box-shadow:none}
#intro .continue{width:100%;min-height:46px;background:#fff;color:var(--ink);border-color:var(--line);border:1.5px solid var(--accent);border-radius:14px;font-size:15px;margin-top:10px;cursor:pointer}

/* 提示气泡 */
#toast{position:fixed;left:50%;bottom:calc(var(--safe-area-inset-bottom, env(safe-area-inset-bottom,0px)) + 24px);transform:translateX(-50%);background:rgba(50,61,58,.92);color:#fff;font-size:13px;padding:8px 16px;border-radius:20px;z-index:30;display:none;max-width:86%;text-align:center}


/* 桌面宽屏下：遮罩与弹窗只覆盖居中的“手机屏”，不铺满整个桌面窗口
   （放在 #mask 主规则之后，确保覆盖四边定位） */
@media (min-width:520px) and (min-height:600px){
  #mask{left:50%;right:auto;top:0;bottom:0;width:390px;transform:translateX(-50%);border-radius:28px;overflow:hidden}
}
/* 隐藏结局金色光晕呼吸动画 */
@keyframes edGlow {
  0%,100%{ filter:drop-shadow(0 0 6px rgba(255,200,60,0.6)); }
  50%{ filter:drop-shadow(0 0 14px rgba(255,210,80,0.95)); }
}
@keyframes edGlowPulse {
  0%,100%{ box-shadow:0 0 30px rgba(212,168,48,0.2),0 10px 30px rgba(153,116,42,0.18); }
  50%{ box-shadow:0 0 55px rgba(255,200,60,0.45),0 10px 30px rgba(153,116,42,0.28); }
}

/* ============ 夜晚压暗 / 天气粒子 / 夜袭警报（氛围层，不拦截点击） ============ */
#night-veil,#fx-canvas,#fx-flash{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none}
#night-veil{z-index:5;opacity:0;transition:opacity 1s ease}
/* canvas 是替换元素，四边0定位不会像 div 那样自动拉伸（会按自身 width 属性定宽），
   必须显式 100%，否则真机上雨雪粒子只铺屏幕左侧一部分 */
#fx-canvas{z-index:6;width:100%;height:100%}
#fx-flash{z-index:7}
/* 夜晚：克制压暗——中心阅读区几乎不变，只让四围与顶部沉进夜色，避免伤眼 */
body.night #night-veil{opacity:1;
  background:
    radial-gradient(120% 90% at 50% 26%, rgba(16,26,46,.08) 0%, rgba(12,20,38,.22) 78%, rgba(9,15,30,.32) 100%),
    linear-gradient(180deg, rgba(24,36,60,.20), rgba(14,22,40,.10))}
/* 夜袭结算：暗红警报光慢速呼吸（弹窗在更上层，内容始终清晰） */
body.raid #night-veil{opacity:1;
  background:
    radial-gradient(110% 85% at 50% 40%, rgba(110,22,18,.10) 0%, rgba(84,14,12,.24) 72%, rgba(50,8,8,.32) 100%),
    linear-gradient(180deg,rgba(58,12,12,.20),rgba(28,6,6,.26));
  animation:raidPulse 2.8s ease-in-out infinite}
@keyframes raidPulse{0%,100%{opacity:.82}50%{opacity:1}}
/* 夜袭弹窗轻微震动（只动弹窗卡片，不影响布局定位） */
body.raid #popup{animation:raidShake .55s ease-in-out}
@keyframes raidShake{0%{transform:translate(0,0)}15%{transform:translate(-5px,2px)}30%{transform:translate(5px,-2px)}45%{transform:translate(-4px,-1px)}60%{transform:translate(4px,1px)}75%{transform:translate(-2px,0)}100%{transform:none}}
/* 雷暴闪电（白蓝一掠，极短） */
#fx-flash.lightning{background:#E8F0FF;animation:fxLightning .7s ease-out}
@keyframes fxLightning{0%{opacity:0}7%{opacity:.45}13%{opacity:.1}21%{opacity:.34}100%{opacity:0}}
/* 桌面宽屏：氛围层同样只覆盖居中的“手机屏” */
@media (min-width:520px) and (min-height:600px){
  #night-veil,#fx-canvas,#fx-flash{left:50%;right:auto;width:390px;top:0;bottom:0;transform:translateX(-50%)}
}

/* ============ 立绘呼吸 / 获得物资弹出等微动效 ============ */
/* 相框里的老师与孩子像纸偶一样轻轻起伏，各自错开相位 */
.photo .p-row img{animation:portraitBreath 3.8s ease-in-out infinite;will-change:transform}
.photo .p-row img:nth-child(2){animation-delay:.5s}
.photo .p-row img:nth-child(3){animation-delay:1s}
.photo .p-row img:nth-child(4){animation-delay:1.5s}
@keyframes portraitBreath{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
/* 物资入手：小图标弹跳出现 */
@keyframes itemPop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.item-pop{animation:itemPop .4s cubic-bezier(.2,.8,.3,1.2) both}
/* 按钮按下更有“按到实物”的反馈 */
.actions button:active,.primary:active,#popup button:active{transform:scale(.96)}
.actions button.night-btn:active{transform:scale(.96)}

/* ============ 外出小游戏：场景化横幅 + 场地氛围 ============ */
.mg-banner{position:relative;overflow:hidden;border-radius:13px;padding:13px 14px 11px;margin-bottom:9px;text-align:center;color:#fff;
  box-shadow:0 6px 16px rgba(30,45,60,.20)}
.mg-banner .mg-b-title{position:relative;font-family:var(--font-kai);font-size:17px;letter-spacing:3px;text-shadow:0 1px 5px rgba(0,0,0,.45)}
.mg-banner .mg-b-sub{position:relative;font-size:11px;opacity:.96;margin-top:3px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
/* 右下角淡淡的场景道具水印，不干扰阅读 */
.mg-banner::after{content:attr(data-deco);position:absolute;right:-2px;bottom:-20px;font-size:72px;opacity:.15;line-height:1;transform:rotate(-8deg);pointer-events:none}
/* 八个地点 + 丧尸战各自的氛围配色 */
.mg-b-shelf{background:linear-gradient(135deg,#D08C46,#9C5F28)}
.mg-b-sneak{background:linear-gradient(135deg,#5B5B86,#32324C)}
.mg-b-dodge{background:linear-gradient(135deg,#4A4F57,#202329)}
.mg-b-math{background:linear-gradient(135deg,#446B52,#2A4838)}
.mg-b-logic{background:linear-gradient(135deg,#4E6E8E,#2F455D)}
.mg-b-match{background:linear-gradient(135deg,#4FA3A0,#2E706F)}
.mg-b-pump{background:linear-gradient(135deg,#B0554B,#77302B)}
.mg-b-memory{background:linear-gradient(135deg,#6FA45C,#426E37)}
/* 教室搜证·找不同 */
.fd-panel{flex:1 1 0;min-width:0;max-width:50%;background:#fffaf0;border:1.5px solid #d9c89c;border-radius:10px;padding:4px;position:relative}
.fd-panel-title{font-size:10px;color:#a89470;text-align:center;margin-bottom:2px}
.fd-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;width:100%}
.fd-cell{height:26px;min-width:0;background:#f5ecd3;border-radius:5px;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;position:relative;transition:background .12s,transform .12s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (max-width:400px){.fd-cell{height:22px;font-size:14px}}
@media (max-width:350px){.fd-cell{height:19px;font-size:12px}}
.fd-cell:hover{background:#f0e4c2}
.fd-cell.fd-mark{background:#ffe0a8;box-shadow:inset 0 0 0 2px #e74c3c}
.fd-cell.fd-wrong{background:#f8c8c8;transition:background .1s}

.mg-b-breath{background:linear-gradient(135deg,#4F97C9,#2D6894)}
.mg-b-zombie{background:linear-gradient(135deg,#5C3230,#211313)}
/* 场地氛围（覆盖原本千篇一律的灰底） */
#shelf{background:linear-gradient(160deg,#F7E9D2,#EDDAB6)!important;border:1px solid #E3C799}
#p-field{background:linear-gradient(160deg,#C9D0D4,#A7B1B7)!important;border:1px solid #96A0A6}
#me-grid{background:linear-gradient(160deg,#E0EFD3,#C8DDB7)!important;border:1px solid #A7C898}
/* 寻物记忆卡片：背面绿底暗纹 / 翻开白底显 emoji / 配对成功浅绿（全实体色，兼容手机 WebView） */
.me-card{position:relative;height:54px;padding:0;border:2px solid #3D6330;border-radius:9px;background:linear-gradient(145deg,#5E8C49,#467236);box-shadow:inset 0 2px 5px rgba(0,0,0,.18);cursor:pointer;transition:background .18s,border-color .18s,transform .1s;-webkit-tap-highlight-color:transparent}
.me-card:active{transform:scale(.95)}
.me-card .me-back{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;font-size:19px;opacity:.4}
.me-card .me-em{font-size:23px;line-height:1;opacity:0}
.me-card.open{background:#fff;border-color:#9CB88C;box-shadow:0 2px 6px rgba(60,90,40,.25)}
.me-card.open .me-back{display:none}
.me-card.open .me-em{opacity:1}
.me-card.done{background:#D5F5E3;border-color:#7DCC9B;box-shadow:none;pointer-events:none}
.me-card.done .me-back{display:none}
.me-card.done .me-em{opacity:1}
#d-road{background:radial-gradient(120% 70% at 50% 0%,#3A3F46 0%,#23262B 55%,#16181B 100%)!important;border:1px solid #3C4148}
#zc-arena,#zd-arena{background:
  radial-gradient(120% 72% at 50% 100%,rgba(120,30,26,.35) 0%,transparent 62%),
  linear-gradient(180deg,#22282E 0%,#181D22 60%,#13161A 100%)!important;
  border-color:#3A2B2A!important}
#zc-floor{background:linear-gradient(90deg,#E74C3C,#A93025)!important;box-shadow:0 0 12px rgba(231,76,60,.55)}
/* 落下的丧尸摇晃着逼近（只动 transform，不碰 JS 控制的 top） */
#zc-arena > div:not(#zc-floor){animation:zLurch .45s ease-in-out infinite alternate}
@keyframes zLurch{from{transform:translateX(-2px) rotate(-6deg)}to{transform:translateX(2px) rotate(6deg)}}
/* 命中爆开 */
@keyframes zHitPop{0%{transform:scale(.4);opacity:1}100%{transform:scale(2.4);opacity:0}}
.z-hit{position:absolute;font-size:34px;pointer-events:none;animation:zHitPop .24s ease-out forwards}
/* 闪避反击中的丧尸：暗红光晕呼吸（用 filter，避开 JS 正在写的 transform:scale） */
#zd-zombie{animation:zGlow 1.3s ease-in-out infinite alternate}
@keyframes zGlow{from{filter:drop-shadow(0 0 6px rgba(190,40,34,.35))}to{filter:drop-shadow(0 0 16px rgba(231,76,60,.85))}}
/* 躲避车道：车道指示可缩放、可发红光预警 */
#d-row span{transition:transform .25s ease,filter .25s ease;display:inline-block}
/* 潜行眼睛状态切换有弹性 */
#sn-eye{display:block;transition:transform .15s ease}

/* ============ 结局 CG：氛围场景 + 电影字幕（纯CSS占位，将来可整图替换为AI立绘） ============ */
.ed-cg{position:relative;height:186px;border-radius:13px;overflow:hidden;margin-bottom:10px;
  box-shadow:inset 0 0 46px rgba(8,12,20,.28),0 4px 14px rgba(30,45,60,.22)}
.ed-cg .cg-sky,.ed-cg .cg-layer,.ed-cg .cg-ground{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
.ed-cg .cg-ground{top:auto;right:0;bottom:0;left:0;height:42px}
.ed-cg .e{position:absolute;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.ed-cg .cg-layer{z-index:3}
/* 字幕条独立置于舞台下方，不遮挡画面，像电影片尾的字幕卡 */
.ed-subs{margin-top:7px;background:rgba(9,13,19,.86);border:1px solid rgba(255,255,255,.10);
  border-radius:9px;padding:8px 11px;color:#F3EFE6;font-family:var(--font-kai);font-size:13px;line-height:1.65;text-align:center;
  text-shadow:0 1px 3px #000}
.ed-subs .ed-sub{display:block;opacity:0;transform:translateY(7px);animation:subIn .7s ease forwards}
.ed-subs .ed-sub:nth-child(1){animation-delay:.45s}
.ed-subs .ed-sub:nth-child(2){animation-delay:1.55s}
.ed-subs .ed-sub:nth-child(3){animation-delay:2.65s}
@keyframes subIn{to{opacity:1;transform:none}}
.cg-float{animation:cgFloat 4.2s ease-in-out infinite alternate}
@keyframes cgFloat{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.cg-drift{animation:cgDrift 7s ease-in-out infinite alternate}
.cg-drift2{animation:cgDrift 9.5s ease-in-out infinite alternate-reverse}
@keyframes cgDrift{from{transform:translateX(-16px)}to{transform:translateX(18px)}}
.cg-fly{animation:cgFly 13s linear infinite;z-index:1}
@keyframes cgFly{0%{left:-14%}100%{left:108%}}
.cg-rise{opacity:0;animation:cgRise .9s cubic-bezier(.2,.8,.3,1) forwards}
.cg-rise.d1{animation-delay:.2s}.cg-rise.d2{animation-delay:.45s}.cg-rise.d3{animation-delay:.7s}
.cg-rise.d4{animation-delay:.95s}.cg-rise.d5{animation-delay:1.2s}
@keyframes cgRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.cg-glow{animation:edGlow 2.2s ease-in-out infinite}
/* 坏结局：烛火慢慢熄灭 */
.cg-out{animation:cgOut 4.5s ease-in forwards}
.cg-out.d1{animation-delay:2.2s}.cg-out.d2{animation-delay:3s}
@keyframes cgOut{0%,55%{opacity:1}100%{opacity:.08}}
/* 字幕下的人物剪影统一压暗，像逆光站着 */
.ed-cg .sil{filter:brightness(.55) sepia(.2)}

/* ============ 旧版内核兼容层：flex gap → 子项 margin 基线 ============
   旧内核不支持 flex gap：默认用子项 margin 形成间距；
   脚本实测 flex gap 生效后给 <html> 加 .supports-flex-gap，清零 margin、由原规则的 gap 接管。
   （grid 容器已在各自规则里用 grid-gap 做声明级回退） */
/* —— 不换行行：左间距（6px 组）—— */
.subbar>*+*,.subbar .right>*+*,.photo .p-row>*+*,.actions>*+*,
.ck-head>*+*,.ck-stat>*+*,.ck-userow>*+*,
.fort-row .f-info .cost-line>*+*{margin-left:6px}
/* —— 其余单行各自的间距 —— */
.subbar .setting>*+*{margin-left:3px}
.def-igroup>*+*,.kid .k-chip>*+*,.fort-card .fc-defbadge>*+*{margin-left:2px}
.kid .k-bar>*+*{margin-left:3px}
.ck-actions>*+*{margin-left:5px}
.ck-teacher-rows>*+*{margin-left:10px}
.fort-card .fc-head>*+*{margin-left:7px}
.fort-card .fc-id>*+*{margin-left:2px}
.fort-card .fc-foot>*+*{margin-top:5px}
.fort-card .fc-equip>*+*,.fort-row>*+*{margin-left:8px}
.gender-pick>*+*{margin-left:12px}
.fort-card .fc-cost .cost-line>span>*+*{margin-left:2px}
/* —— 纵向列：上间距 —— */
.kid .k-bars>*+*{margin-top:3px}
/* —— 可换行行：容器负 margin 抵消首位偏移，子项双向 margin —— */
#popup .btns{margin:-8px 0 0 -8px}
#popup .btns>*{margin:8px 0 0 8px}
.ck-skills{margin:-3px 0 0 -3px}
.ck-skills>*{margin:3px 0 0 3px}
.ck-overlay-panel .op-grid{margin:-6px 0 0 -6px}
.ck-overlay-panel .op-grid>*{margin:6px 0 0 6px}
.fort-card .fc-cost .cost-line{margin:-8px 0 0 -8px}
.fort-card .fc-cost .cost-line>*{margin:8px 0 0 8px}
.fort-card .fc-placed{margin:-4px 0 0 -4px}
.fort-card .fc-placed>*{margin:4px 0 0 4px}
/* —— JS 模板内联 flex 间距用的工具类，间距值由 --g 变量传入 —— */
.fg{display:flex}
.fg>*+*{margin-left:var(--g,6px)}
.fgw{display:flex;flex-wrap:wrap;margin:calc(var(--g,6px) * -1) 0 0 calc(var(--g,6px) * -1)}
.fgw>*{margin:var(--g,6px) 0 0 var(--g,6px)}
/* —— 新内核：实测支持 flex gap 后，清零全部 margin 基线（gap 由各原规则声明）—— */
.supports-flex-gap .subbar>*+*,.supports-flex-gap .subbar .right>*+*,
.supports-flex-gap .subbar .setting>*+*,.supports-flex-gap .def-igroup>*+*,
.supports-flex-gap .photo .p-row>*+*,.supports-flex-gap .kid .k-chip>*+*,
.supports-flex-gap .kid .k-bars>*+*,.supports-flex-gap .kid .k-bar>*+*,
.supports-flex-gap .actions>*+*,.supports-flex-gap .ck-head>*+*,
.supports-flex-gap .ck-stat>*+*,.supports-flex-gap .ck-skills>*+*,
.supports-flex-gap .ck-actions>*+*,.supports-flex-gap .ck-teacher-rows>*+*,
.supports-flex-gap .ck-userow>*+*,.supports-flex-gap .ck-overlay-panel .op-grid>*,
.supports-flex-gap .fort-card .fc-head>*+*,.supports-flex-gap .fort-card .fc-id>*+*,.supports-flex-gap .fort-card .fc-namerow>*+*,
.supports-flex-gap .fort-card .fc-pips>*+*,.supports-flex-gap .fort-card .fc-defbadge>*+*,
.supports-flex-gap .fort-card .fc-foot>*+*,.supports-flex-gap .fort-card .fc-cost .cost-line>*,
.supports-flex-gap .fort-card .fc-cost .cost-line>span>*+*,
.supports-flex-gap .fort-card .fc-equip>*+*,.supports-flex-gap .fort-card .fc-placed>*,
.supports-flex-gap .fort-row>*+*,.supports-flex-gap .fort-row .f-info .cost-line>*+*,
.supports-flex-gap .gender-pick>*+*,.supports-flex-gap #popup .btns>*,
.supports-flex-gap .fg>*+*,.supports-flex-gap .fgw>*{margin:0}
.supports-flex-gap .ck-skills,.supports-flex-gap .ck-overlay-panel .op-grid,
.supports-flex-gap .fort-card .fc-cost .cost-line,.supports-flex-gap .fort-card .fc-placed,
.supports-flex-gap #popup .btns,.supports-flex-gap .fgw{margin-top:0;margin-left:0}
.supports-flex-gap .fg{gap:var(--g,6px)}
.supports-flex-gap .fgw{gap:var(--g,6px)}
</style>
</head>
<body>

<!-- 夜晚压暗层 / 天气粒子层 / 雷暴闪光层（均不拦截点击） -->
<div id="night-veil"></div>
<canvas id="fx-canvas"></canvas>
<div id="fx-flash"></div>

<!-- ============ 开场：性别选择 ============ -->
<section id="intro" class="view active">
  <div class="hero">
    <h1>末日带娃100天</h1>
    <p class="sub">世界末日那天，你和三个孩子留在教室里……</p>
  </div>
  <div class="story"><span class="ln">窗外是重重人影，城市充满了诡异的嘶吼声。</span><span class="ln">午睡室里，小安、小乐和小念还在睡着。</span><span class="ln">你是这间幼儿园里唯一的大人。</span><span class="ln">食物只够吃几天，大门紧闭着。</span><span class="ln">从今天起，你要带他们活下去。</span></div>
  <div class="gender-pick">
    <button id="pick-male"><img src="./assets/img01.png" alt="男老师">我是男老师</button>
    <button id="pick-female"><img src="./assets/img02.png" alt="女老师">我是女老师</button>
  </div>
  <button class="start" id="btn-start" disabled>开 始</button>
  <button class="continue" id="btn-continue" style="display:none">继续上次的进度</button>
</section>

<!-- ============ 主页 ============ -->
<section id="home" class="view">
  <div class="topbar">
    <div class="title">末日带娃100天</div>
  </div>
  <div class="subbar">
    <div class="setting" id="btn-setting" title="设置 / 存档">⚙️<small>设置</small></div>
    <div class="right">
      <span class="weather" id="weather-show" title="">☀️ 晴</span>
      <div class="day" id="day-show">第 1 天<small>早上 6:00</small></div>
    </div>
  </div>

  <!-- 防御度条 -->
  <div id="defense-bar" class="fg" style="--g:7px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 11px 8px 12px;margin-bottom:8px;align-items:center">
    <span style="font-size:14px">🛡️</span>
    <div style="flex:1">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--soft);margin-bottom:3px">
        <span>幼儿园防御度</span><span id="def-val">6 / 57</span>
      </div>
      <div style="height:6px;background:#EFE5D2;border-radius:3px;overflow:hidden">
        <div id="def-fill" style="height:100%;background:var(--accent);border-radius:3px;width:10%"></div>
      </div>
    </div>
    <div class="def-igroup">
      <button id="btn-defense-log" class="def-ibtn" style="font-size:21px" title="防御日志" aria-label="防御日志">📜</button>
      <button id="btn-panorama" class="def-ibtn" style="font-size:25px" title="幼儿园全景" aria-label="幼儿园全景">🏫</button>
    </div>
  </div>

  <!-- 加固点位一览（一行排列） -->
  <div id="fort-spots" class="fgw" style="--g:5px;margin-bottom:8px"></div>

  <div class="scene">
    <div class="room">
      <img id="classroom-img" src="./assets/img03.jpg" alt="教室">
      <!-- 6个加固点位徽章由JS渲染 -->
      <!-- 装饰架入口：仅图标，固定在教室左上角 -->
      <div id="decor-shelf" title="点击查看装饰架">🧸</div>
      <div class="photo">
        <div class="p-mat">
        <div class="p-row">
          <img id="photo-teacher" class="p-teacher" src="./assets/img02.png" alt="老师">
          <img class="p-kids" src="./assets/img04.png" alt="孩子们">
        </div>
        </div>
      </div>
    </div>
  </div>

  <div class="stats" id="teacher-stats"><!-- 老师三条状态由JS渲染 --></div>

  <div class="kids" id="kids-cards"><!-- 三个孩子卡片由JS渲染 --></div>

  <div class="inv" id="inv-bar"><!-- 物资栏由JS渲染 --></div>

  <div class="actions" id="action-bar"><!-- 时段行动按钮由JS渲染 --></div>
</section>

<!-- 弹窗与提示 -->
<div id="mask"><div id="popup"></div></div>
<div id="toast"></div>

<script src="./main.js"></script>
</body>
</html>
